<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Calendrier de l'Avent</title><style>body{font-family:Trebuchet MS,sans-serif;background:linear-gradient(135deg,#b71c1c,#1b5e20);margin:0;padding:20px;text-align:center;color:#fff}.header{max-width:850px;margin:20px auto}.heart{font-size:55px;animation:heartbeat 1.4s infinite}.main-title{font-size:clamp(2.2rem,5vw,4rem);text-shadow:0 0 10px #fff,0 0 20px gold;animation:glow 3s infinite alternate,floatTitle 4s infinite}.subtitle{color:#ffe082}.intro{background:rgba(255,255,255,.15);padding:20px;border-radius:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:15px;max-width:900px;margin:auto}.day{position:relative;background:#fff;color:#333;height:90px;display:flex;align-items:center;justify-content:center;border-radius:18px;font-size:24px;font-weight:bold;cursor:pointer;overflow:hidden}.day::before{content:'';position:absolute;left:50%;transform:translateX(-50%);top:0;bottom:0;width:12px;background:#c62828}.day::after{content:'🎀';position:absolute;top:8px;left:50%;transform:translateX(-50%)}.day:not(.locked){animation:pulseDay 2.5s infinite}.day.opened{animation:giftOpen .8s forwards;background:linear-gradient(135deg,#FFD700,#FFECB3)}.locked{background:#888;color:#fff}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);justify-content:center;align-items:center;padding:15px}.modal-content{background:#fff;color:#000;padding:20px;border-radius:15px;max-width:700px;width:100%;max-height:90vh;overflow:auto}.modal-content img{width:100%;height:auto}.close{padding:12px 25px;background:#b71c1c;color:#fff;border:none;border-radius:8px}@keyframes heartbeat{14%,42%{transform:scale(1.25)}}@keyframes glow{to{text-shadow:0 0 20px #fff,0 0 40px gold}}@keyframes floatTitle{50%{transform:translateY(-8px)}}@keyframes giftOpen{0%{transform:rotateY(0)}60%{transform:rotateY(180deg) scale(1.25)}100%{transform:rotateY(180deg)}}@keyframes pulseDay{70%{box-shadow:0 0 0 15px rgba(255,215,0,0)}}@media(max-width:480px){.grid{grid-template-columns:repeat(3,1fr)}} </style></head><body><div id=snow></div><div class=header><div class=heart>❤️</div><h1 class=main-title>✨ Notre Calendrier de l'Avent ✨</h1><h2 class=subtitle>24 jours de souvenirs, de sourires et d'amour</h2><div class=intro>Ma chérie, chaque jour jusqu'à Noël, une surprise t'attend ❤️🎄✨</div></div><div class=grid id=calendar></div><div class=modal id=modal><div class=modal-content><img id=photo><p id=message></p><button class=close onclick='closeModal()'>✕ Fermer</button></div></div><script>const photos = [

{photo:"photos/jour11.jpg",text:"PLAGE AUX ÉTOILES ✨🌴"},

{photo:"photos/jour13.jpg",text:"ALLEZ LE STADE TOULOUSAIN !!! 🏉🔴⚫"},

];const calendar=document.getElementById('calendar');const t=new Date();let currentDay=0;if(t.getMonth()===11)currentDay=t.getDate()>24?24:t.getDate();for(let d=1;d<=24;d++){const b=document.createElement('div');b.className='day';b.textContent=d;if(localStorage.getItem('opened-'+d))b.classList.add('opened');if(d>currentDay)b.classList.add('locked');else b.onclick=()=>{b.classList.add('opened');localStorage.setItem('opened-'+d,true);setTimeout(()=>openPhoto(d),500)};calendar.appendChild(b);}function openPhoto(d){photo.src=photos[d-1].photo;message.textContent=photos[d-1].text;modal.style.display='flex';}function closeModal(){modal.style.display='none';}modal.onclick=e=>{if(e.target===modal)closeModal();};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});</script></body></html>
